project_name = "wwe2k14"
file_path = "game/default.xex"
out_directory_path = "generated"

# WWE 2K14 retail disc: default.xex "WWE14_DVD_MASTER.exe", title ID 545408B2, version 0.0.0.2
# (built 2013-09-03), no title update.

# The CRT's setjmp / longjmp (jmp_buf in r3). Recompiled as plain code, setjmp is truncated and
# returns the jmp_buf address, so libjpeg decodes take their error path (a crash in the Create
# modes). The codegen replaces calls to them. Found by tools/find_functions.py (f14-f31 save /
# restore via r3); longjmp sits 0x320 bytes before setjmp.
setjmp_address = 0x83438D70
longjmp_address = 0x83438A50

includes = ["config/functions.toml", "config/functions_fptrs.toml", "config/functions_thunks.toml", "config/hooks.toml"]
